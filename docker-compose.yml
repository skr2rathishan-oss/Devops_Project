# One file for both modes. Pick the mode with COMPOSE_PROFILES in .env:
#   COMPOSE_PROFILES=prod  -> built React app on nginx (CLIENT_HOST_PORT), API behind /api
#   COMPOSE_PROFILES=dev   -> Vite + nodemon with hot reload on your local source
# Then just: docker compose up -d --build
# Or override once without editing .env: docker compose --profile dev up -d --build

x-server-env: &server-env
  PORT: 5000
  CLIENT_URL: ${CLIENT_URL:?set CLIENT_URL in .env}

  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:?set DB_NAME in .env}
  DB_USER: ${DB_USER:?set DB_USER in .env}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  DB_SSL: "false"

  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
  RESET_TOKEN_EXPIRES_MINUTES: ${RESET_TOKEN_EXPIRES_MINUTES:-30}

  MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN:-}
  MAILTRAP_SENDER_EMAIL: ${MAILTRAP_SENDER_EMAIL:-}
  MAILTRAP_SENDER_NAME: ${MAILTRAP_SENDER_NAME:-No Reply}

x-server: &server
  restart: unless-stopped
  init: true

  depends_on:
    mysql:
      condition: service_healthy

  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s


services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

    # Bound to localhost only: reachable from your machine (e.g. Workbench), never from outside.
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e \"SELECT 1 FROM $$MYSQL_DATABASE.users LIMIT 1\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s


  # ---------- Production ----------

  server:
    <<: *server
    profiles: [prod]

    build:
      context: ./server
      target: prod

    environment:
      <<: *server-env


  client:
    profiles: [prod]

    build:
      context: ./client
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}

    restart: unless-stopped

    depends_on:
      server:
        condition: service_healthy

    ports:
      - "${CLIENT_HOST_PORT:-8080}:80"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ---------- Development (hot reload) ----------

  server-dev:
    <<: *server
    profiles: [dev]

    build:
      context: ./server
      target: dev

    environment:
      <<: *server-env
      CLIENT_URL: http://localhost:${CLIENT_DEV_HOST_PORT:-5173}

    ports:
      - "${SERVER_HOST_PORT:-5000}:5000"

    volumes:
      - ./server:/app
      - /app/node_modules

    # Same hostname as production, so the Vite proxy (and anything else) uses http://server:5000.
    networks:
      default:
        aliases: [server]


  client-dev:
    profiles: [dev]

    build:
      context: ./client
      target: dev

    restart: unless-stopped

    depends_on:
      server-dev:
        condition: service_healthy

    environment:
      API_PROXY_TARGET: http://server:5000
      VITE_API_BASE_URL: /api
      VITE_USE_POLLING: "true"

    ports:
      - "${CLIENT_DEV_HOST_PORT:-5173}:5173"

    volumes:
      - ./client:/app
      - /app/node_modules

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  mysql_data:
